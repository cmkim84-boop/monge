/* Point color: warm amber #ffb81f, on warm paper for the diary feel.
   Shape scale (locked): 8px small controls (tabs, delete/small buttons) ·
   10px buttons/inputs/alerts · 12px (--radius) cards & list rows ·
   50%/999px avatars & pill tags only. */
:root {
  --primary: #ffb81f;
  --primary-dark: #e0a100;
  --primary-tint: #fff1d6;
  --on-primary: #2b1f06;
  --danger: #d9573f;
  --ink: #26301f;
  --muted: #7c8577;
  --bg: #f6f6ef;
  --card: #ffffff;
  --border: #e4e6dc;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --primary: #ffc94d;
    --primary-dark: #f0b400;
    --primary-tint: #3a2c0d;
    --on-primary: #221904;
    --danger: #e8846c;
    --ink: #ecefe6;
    --muted: #9ba592;
    --bg: #12160f;
    --card: #1c2318;
    --border: #2e362a;
  }
}
:root[data-theme="dark"] {
  --primary: #ffc94d;
  --primary-dark: #f0b400;
  --primary-tint: #3a2c0d;
  --on-primary: #221904;
  --danger: #e8846c;
  --ink: #ecefe6;
  --muted: #9ba592;
  --bg: #12160f;
  --card: #1c2318;
  --border: #2e362a;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  letter-spacing: -0.2px;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  max-width: 480px;
  margin: 0 auto;
  position: relative;
  background: var(--bg);
  overflow: hidden;
}

.hidden { display: none !important; }

.view {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  padding-bottom: 76px;
}

#view-walk.view { padding-bottom: 0; overflow: hidden; }

.topbar {
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  background: var(--card);
  border-bottom: 1px solid var(--border);
}
.topbar h1 { font-size: 1.1rem; font-weight: 700; margin: 0; }

.topbar-brand { position: relative; overflow: hidden; }
.brand-watermark {
  position: absolute;
  right: -8px;
  top: 50%;
  transform: translateY(-50%) rotate(-14deg);
  width: 60px;
  height: 60px;
  color: var(--primary-dark);
  opacity: 0.4;
  pointer-events: none;
}
.topbar-brand .brand-title {
  font-family: 'Gaegu', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-size: 2.2rem;
  font-weight: 700;
  margin: 0;
  position: relative;
  z-index: 1;
}

.btn-icon {
  background: none;
  border: none;
  font-size: 1.4rem;
  cursor: pointer;
  color: var(--ink);
  padding: 4px 8px;
}

/* ---- Profile ---- */
#profile-display, .profile-form {
  padding: 20px 20px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.profile-card {
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 24px 20px;
  text-align: center;
}

.photo-wrap {
  display: block;
  width: 140px;
  height: 140px;
  margin: 0 auto 12px;
  border-radius: 50%;
  background: var(--border);
  position: relative;
  overflow: visible;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  color: var(--muted);
}
.photo-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}
.photo-edit-badge {
  position: absolute;
  bottom: 2px;
  right: 2px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--primary);
  color: var(--on-primary);
  font-size: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--card);
}

.profile-card h2 {
  margin: 4px 0;
  font-size: 1.6rem;
  font-weight: 700;
  font-family: 'Gaegu', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}

.profile-tags {
  display: flex;
  gap: 6px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.tag {
  background: var(--primary-tint);
  color: var(--primary-dark);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 0.8rem;
}

.profile-stats {
  display: flex;
  justify-content: space-around;
  border-top: 1px solid var(--border);
  padding-top: 14px;
}
.profile-stats div { display: flex; flex-direction: column; gap: 2px; }
.profile-stats strong { font-size: 1.2rem; }
.profile-stats span { font-size: 0.75rem; color: var(--muted); }

.profile-form {
  padding-top: 10px;
}
.profile-form label {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 0.9rem;
  color: var(--muted);
}
.profile-form input[type=text], .profile-form select {
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  font-size: 1rem;
  background: var(--card);
  color: var(--ink);
}
#photo-placeholder { padding: 8px; text-align: center; }

/* ---- Buttons ---- */
.btn-primary {
  background: var(--primary);
  color: var(--on-primary);
  border: none;
  border-radius: 10px;
  padding: 14px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
}
.btn-primary:active { background: var(--primary-dark); }
.btn-large { width: 100%; }
.btn-round { border-radius: 10px; padding: 18px; font-size: 1.05rem; }
.btn-ghost {
  background: none;
  border: none;
  color: var(--muted);
  padding: 8px;
  cursor: pointer;
}
.btn-danger {
  background: var(--danger);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 14px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  width: 100%;
}

/* ---- Walk view ---- */
.walk-topbar { justify-content: space-between; padding: 14px 16px; }
.walk-stats { display: flex; gap: 18px; flex: 1; justify-content: center; }
.walk-stats div { display: flex; flex-direction: column; align-items: center; }
.walk-stats strong { font-size: 1.43rem; }
.walk-stats span { font-size: 0.91rem; color: var(--muted); }
.walk-stat-minor { align-self: flex-end; margin-bottom: 2px; }
.walk-stat-minor strong { font-size: 0.85rem; font-weight: 600; }
.walk-stat-minor span { font-size: 0.65rem; }

#map { flex: 1; width: 100%; background: #ddd; }

.walk-controls {
  flex-shrink: 0;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--card);
  border-top: 1px solid var(--border);
}

.event-buttons {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}
.btn-event {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 12px 2px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--ink);
  font-size: 0.8rem;
  cursor: pointer;
}
.btn-event:active { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }

.gps-warning {
  position: absolute;
  top: 70px;
  left: 16px;
  right: 16px;
  background: #fff6d8;
  color: #8a6d1a;
  padding: 8px 12px;
  border-radius: 10px;
  font-size: 0.8rem;
  text-align: center;
}

/* ---- Summary ---- */
#summary-map { height: 220px; width: 100%; flex-shrink: 0; background: #ddd; }
.summary-body { padding: 16px 20px 24px; }
.summary-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 10px;
}
.summary-grid-2 { grid-template-columns: repeat(2, 1fr); }
.summary-cell {
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 14px 8px;
  text-align: center;
}
.summary-cell strong { display: block; font-size: 1.3rem; }
.summary-cell span { font-size: 0.75rem; color: var(--muted); }

.summary-body h3 { margin: 18px 0 8px; font-size: 1rem; }
.event-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.event-list li {
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 10px 14px;
  display: flex;
  justify-content: space-between;
  font-size: 0.9rem;
}
.event-list li span.time { color: var(--muted); font-size: 0.8rem; }
.event-photo { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.event-photo img { width: 36px; height: 36px; object-fit: cover; border-radius: 8px; }

/* ---- Photo lightbox ---- */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.94);
  z-index: 2000;
}
.lightbox.hidden { display: none; }
.lightbox-close {
  position: absolute;
  top: calc(14px + env(safe-area-inset-top));
  right: 16px;
  background: rgba(255,255,255,0.12);
  border: none;
  color: #fff;
  font-size: 1.3rem;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
  z-index: 2001;
}
.lightbox-counter {
  position: absolute;
  top: calc(20px + env(safe-area-inset-top));
  left: 0;
  right: 0;
  text-align: center;
  color: #fff;
  font-size: 0.85rem;
  z-index: 2001;
  pointer-events: none;
}
.lightbox-track {
  display: flex;
  width: 100%;
  height: 100%;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
}
.lightbox-track::-webkit-scrollbar { display: none; }
.lightbox-slide {
  flex: 0 0 100%;
  scroll-snap-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 60px 16px;
}
.lightbox-slide img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }

.sticky-bottom {
  margin: 4px 20px 20px;
  width: calc(100% - 40px);
}

/* ---- Stats ---- */
.stats-body { padding: 16px 20px 24px; }
.stats-tabs {
  display: flex;
  gap: 6px;
  background: var(--border);
  padding: 4px;
  border-radius: 12px;
  margin-bottom: 16px;
}
.stats-tab {
  flex: 1;
  background: none;
  border: none;
  border-radius: 8px;
  padding: 9px 4px;
  font-size: 0.85rem;
  color: var(--muted);
  cursor: pointer;
}
.stats-tab.active {
  background: var(--card);
  color: var(--ink);
  font-weight: 700;
}
.stats-body h3 { margin: 20px 0 10px; font-size: 1rem; font-weight: 700; }
.chart-wrap {
  background: var(--card);
  border-radius: var(--radius);

<!-- Firebase 프로젝트 설정값. SETUP.md 안내대로 값을 채워주세요. -->
<script src="firebase-config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut,
  setPersistence, browserLocalPersistence,
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import {
  initializeFirestore, persistentLocalCache, persistentSingleTabManager,
  doc, setDoc, deleteDoc, onSnapshot, collection, query, orderBy,
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

if (!window.firebaseConfig || !window.firebaseConfig.apiKey) {
  document.body.innerHTML =
    '<div style="padding:60px 24px;text-align:center;font-family:-apple-system,sans-serif;line-height:1.7;color:#555;">' +
    'Firebase 설정이 필요해요.<br>firebase-config.js 파일에 프로젝트 설정값을 입력해주세요.<br>(SETUP.md 참고)</div>';
  throw new Error('firebase-config.js 에 설정값이 없습니다.');
}

const fbApp = initializeApp(window.firebaseConfig);
const auth = getAuth(fbApp);
setPersistence(auth, browserLocalPersistence).catch((err) => console.warn('persistence 설정 실패', err));
const db = initializeFirestore(fbApp, {
  localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() }),
});

let currentUid = null;
let walksCache = [];
let profileCache = { photo: null };
let unsubWalks = null;
let unsubProfile = null;

function attachFirestoreListeners(uid) {
  const walksQ = query(collection(db, 'users', uid, 'walks'), orderBy('startTime', 'desc'));
  unsubWalks = onSnapshot(walksQ, (snap) => {
    walksCache = snap.docs.map((d) => d.data());
    refreshCurrentView();
  }, (err) => console.error('walks sync error', err));
  unsubProfile = onSnapshot(doc(db, 'users', uid, 'meta', 'profile'), (snap) => {
    profileCache = snap.exists() ? snap.data() : { photo: null };
    if (currentViewName === 'profile') renderProfileView();
  }, (err) => console.error('profile sync error', err));
}

function detachFirestoreListeners() {
  if (unsubWalks) unsubWalks();
  if (unsubProfile) unsubProfile();
  unsubWalks = null;
  unsubProfile = null;
  walksCache = [];
  profileCache = { photo: null };
}

onAuthStateChanged(auth, (user) => {
  if (user) {
    currentUid = user.uid;
    attachFirestoreListeners(currentUid);
    renderProfileView();
    showView('profile');
  } else {
    currentUid = null;
    detachFirestoreListeners();
    showView('login');
  }
});

document.getElementById('btn-login').addEventListener('click', async () => {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if (!email || !password) { errEl.textContent = '이메일과 비밀번호를 입력해주세요.'; return; }
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (err) {
    console.error('login error', err);
    errEl.textContent = `로그인 실패 (${err.code || err.message}) — 이메일/비밀번호를 확인해주세요.`;
  }
});

document.getElementById('btn-logout').addEventListener('click', async () => {
  if (!confirm('로그아웃 할까요?')) return;
  await signOut(auth);
});

// ===== 상태/저장소 =====
const FIXED_PROFILE = { name: '몽이', breed: '비숑프리제', birth: '2020-01-01', gender: '남아' };

function calcAge(birthStr) {
  const birth = new Date(birthStr);
  const now = new Date();
  let years = now.getFullYear() - birth.getFullYear();
  const m = now.getMonth() - birth.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < birth.getDate())) years--;
  return `${years}살`;
}

function loadProfile() {
  return {
    name: FIXED_PROFILE.name,
    breed: FIXED_PROFILE.breed,
    age: calcAge(FIXED_PROFILE.birth),
    gender: FIXED_PROFILE.gender,
    photo: profileCache.photo || null,
  };
}
function savePhoto(dataUrl) {
  if (!currentUid) return;
  setDoc(doc(db, 'users', currentUid, 'meta', 'profile'), { photo: dataUrl }, { merge: true })
    .catch((err) => {
      console.error('save photo error', err);
      alert('사진 저장에 실패했어요 (' + (err.code || err.message) + ')');
    });
}

function loadWalks() {
  return walksCache;
}
function saveWalk(record) {
  if (!currentUid) return Promise.resolve();
  return setDoc(doc(db, 'users', currentUid, 'walks', record.id), record)
    .catch((err) => console.error('save walk error', err));
}
function removeWalk(id) {
  if (!currentUid) return Promise.resolve();
  return deleteDoc(doc(db, 'users', currentUid, 'walks', id))
    .catch((err) => console.error('delete walk error', err));
}

// ===== 유틸 =====
function haversine(a, b) {
  const R = 6371000;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(b.lat - a.lat);
  const dLng = toRad(b.lng - a.lng);
  const lat1 = toRad(a.lat);
  const lat2 = toRad(b.lat);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function pathDistance(path) {
  let d = 0;
  for (let i = 1; i < path.length; i++) d += haversine(path[i - 1], path[i]);
  return d;
}
function formatDuration(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2, '0');
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}
function formatDurationLong(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  if (h > 0) return `${h}시간 ${m}분`;
  return `${m}분`;
}
function formatDateKorean(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()} (${'일월화수목금토'[d.getDay()]}) ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
}
function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// 산책 중 사진은 여러 장 쌓이므로 Firestore 문서 용량(최대 1MB)을 아끼기 위해 리사이즈/압축해서 저장
function resizeImageToDataUrl(file, maxDim = 900, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round((height * maxDim) / width); width = maxDim; }
          else { width = Math.round((width * maxDim) / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ===== 뷰 전환 =====
const views = {
  login: document.getElementById('view-login'),
  profile: document.getElementById('view-profile'),
  walk: document.getElementById('view-walk'),
  summary: document.getElementById('view-summary'),
  stats: document.getElementById('view-stats'),
  history: document.getElementById('view-history'),
};
const bottomNav = document.getElementById('bottom-nav');
let currentViewName = 'login';

function showView(name) {
  currentViewName = name;
  Object.entries(views).forEach(([key, el]) => el.classList.toggle('hidden', key !== name));
  bottomNav.classList.toggle('hidden', name === 'walk' || name === 'summary' || name === 'stats' || name === 'login');
  document.querySelectorAll('.nav-btn').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.nav === name);
  });
  if (name === 'walk') initWalkMapIfNeeded();
}

function renderProfileStats() {
  const walks = loadWalks();
  const totalDist = walks.reduce((sum, w) => sum + w.distanceM, 0) / 1000;
  const today = new Date().toDateString();
  const todayCount = walks.filter((w) => new Date(w.startTime).toDateString() === today).length;
  document.getElementById('stat-total-walks').textContent = walks.length;

function defaultPawSvg() {

// ===== 산책 화면 =====
let walkMap, walkPolyline, walkMarker, watchId;
let walkPath = [];
let walkEvents = [];
let walkStartTime = null;
let walkTimerInterval = null;
const eventIcons = { poop: '💩', treat: '🦴', photo: '📷' };

const GPS_MAX_ACCURACY_M = 50; // 오차 반경이 이보다 크면 버림
const GPS_MAX_SPEED_MPS = 8;   // 순간 속도가 이보다 크면 GPS 튐으로 보고 버림 (약 29km/h)
let gpsRejectStreak = 0;

function isAcceptableGpsPoint(point, accuracy) {
  const last = walkPath[walkPath.length - 1];
  if (!last) return true; // 첫 좌표는 정확도와 무관하게 항상 인정 (기준점이 필요함)
  if (gpsRejectStreak >= 5) return true; // 계속 거부되면 트래킹이 멈추지 않도록 강제로 인정
  if (typeof accuracy === 'number' && accuracy > GPS_MAX_ACCURACY_M) return false;
  const dtSec = (point.t - last.t) / 1000;
  if (dtSec > 0) {
    const speed = haversine(last, point) / dtSec;
    if (speed > GPS_MAX_SPEED_MPS) return false;
  }
  return true;
}

function initWalkMapIfNeeded() {
  if (walkMap) { setTimeout(() => walkMap.invalidateSize(), 50); return; }
  walkMap = L.map('map', { zoomControl: true }).setView([37.5665, 126.9780], 16);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19,
  }).addTo(walkMap);
  walkPolyline = L.polyline([], { color: '#ffb81f', weight: 5 }).addTo(walkMap);

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      (pos) => walkMap.setView([pos.coords.latitude, pos.coords.longitude], 16),
      () => {},
      { enableHighAccuracy: true }
    );
  }
  setTimeout(() => walkMap.invalidateSize(), 100);
}

document.getElementById('btn-back-from-walk').addEventListener('click', () => {
  if (watchId) {
    const ok = confirm('산책 중입니다. 정말 나가시겠어요? (기록되지 않습니다)');
    if (!ok) return;
    stopTracking();
  }
  renderProfileView();
  showView('profile');
});

document.getElementById('btn-start-walk').addEventListener('click', startWalk);
document.getElementById('btn-end-walk').addEventListener('click', endWalk);

document.querySelectorAll('.btn-event[data-type]').forEach((btn) => {
  btn.addEventListener('click', () => logEvent(btn.dataset.type, btn.dataset.sub));
});

document.getElementById('btn-photo-event').addEventListener('click', () => {
  document.getElementById('photo-capture-input').click();
});

document.getElementById('photo-capture-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const dataUrl = await resizeImageToDataUrl(file);
  logPhotoEvent(dataUrl);
});

function startWalk() {
  if (!navigator.geolocation) {
    alert('이 브라우저는 위치 정보를 지원하지 않습니다.');
    return;
  }
  walkPath = [];
  walkEvents = [];
  walkStartTime = Date.now();
  gpsRejectStreak = 0;
  document.getElementById('pre-walk-controls').classList.add('hidden');
  document.getElementById('in-walk-controls').classList.remove('hidden');
  document.getElementById('gps-warning').classList.add('hidden');
  walkPolyline.setLatLngs([]);

  walkTimerInterval = setInterval(updateWalkStats, 1000);

  watchId = navigator.geolocation.watchPosition(
    (pos) => {
      document.getElementById('gps-warning').classList.add('hidden');
      const point = { lat: pos.coords.latitude, lng: pos.coords.longitude, t: Date.now() };
      if (!isAcceptableGpsPoint(point, pos.coords.accuracy)) {
        gpsRejectStreak++;
        return;
      }
      gpsRejectStreak = 0;
      walkPath.push(point);
      walkPolyline.addLatLng([point.lat, point.lng]);
      walkMap.panTo([point.lat, point.lng]);
      if (!walkMarker) {
        walkMarker = L.circleMarker([point.lat, point.lng], { radius: 7, color: '#2b1f06', weight: 2, fillColor: '#ffb81f', fillOpacity: 1 }).addTo(walkMap);
      } else {
        walkMarker.setLatLng([point.lat, point.lng]);
      }
      updateWalkStats();
    },
    () => {
      document.getElementById('gps-warning').classList.remove('hidden');
    },
    { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
  );
}

function updateWalkStats() {
  const elapsedSec = (Date.now() - walkStartTime) / 1000;
  const distM = pathDistance(walkPath);
  document.getElementById('walk-distance').textContent = (distM / 1000).toFixed(2);
  document.getElementById('walk-time').textContent = formatDuration(elapsedSec);
  const kmh = elapsedSec > 0 ? (distM / 1000) / (elapsedSec / 3600) : 0;
  document.getElementById('walk-pace').textContent = kmh.toFixed(1);
}

function logEvent(type, sub) {
  const last = walkPath[walkPath.length - 1];
  const evt = { type, sub, t: Date.now(), lat: last ? last.lat : null, lng: last ? last.lng : null };
  walkEvents.push(evt);
  if (last) {
    const icon = L.divIcon({ html: `<div style="font-size:20px;transform:translate(-50%,-100%);">${eventIcons[type]}</div>`, className: '' });
    L.marker([last.lat, last.lng], { icon }).addTo(walkMap);
  }
  flashToast(`${eventIcons[type]} ${sub} 기록됨`);
}

function logPhotoEvent(dataUrl) {
  const last = walkPath[walkPath.length - 1];
  const evt = { type: 'photo', sub: '사진', t: Date.now(), lat: last ? last.lat : null, lng: last ? last.lng : null, photo: dataUrl };
  walkEvents.push(evt);
  if (last) {
    const icon = L.divIcon({ html: `<div style="font-size:20px;transform:translate(-50%,-100%);">📷</div>`, className: '' });
    L.marker([last.lat, last.lng], { icon }).addTo(walkMap);
  }
  flashToast('📷 사진 기록됨');
}

function flashToast(msg) {
  let toast = document.getElementById('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    toast.style.cssText = 'position:absolute;top:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.75);color:#fff;padding:8px 16px;border-radius:20px;font-size:0.85rem;z-index:999;transition:opacity .3s;';
    document.getElementById('view-walk').appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = '1';
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => (toast.style.opacity = '0'), 1200);
}

function stopTracking() {
  if (watchId) navigator.geolocation.clearWatch(watchId);
  watchId = null;
  clearInterval(walkTimerInterval);
}

function endWalk() {
  if (walkPath.length === 0) {
    const ok = confirm('이동 경로가 기록되지 않았어요. 그래도 종료할까요?');
    if (!ok) return;
  }
  stopTracking();
  const endTime = Date.now();
  const distanceM = pathDistance(walkPath);
  const durationSec = (endTime - walkStartTime) / 1000;

  const record = {
    id: 'w_' + walkStartTime,
    startTime: walkStartTime,
    endTime,
    durationSec,
    distanceM,
    path: walkPath,
    events: walkEvents,
  };
  saveWalk(record);

  document.getElementById('pre-walk-controls').classList.remove('hidden');
  document.getElementById('in-walk-controls').classList.add('hidden');
  if (walkMarker) { walkMap.removeLayer(walkMarker); walkMarker = null; }
  walkMap.eachLayer((layer) => {
    if (layer instanceof L.Marker) walkMap.removeLayer(layer);
  });
  walkPolyline.setLatLngs([]);

  showWalkSummary(record, true);
}

// ===== 요약 화면 =====
let summaryMapInstance = null;

function showWalkSummary(record, isJustFinished) {
  document.getElementById('summary-title').textContent = isJustFinished ? '오늘의 산책 요약' : formatDateKorean(record.startTime);
  document.getElementById('summary-distance').textContent = (record.distanceM / 1000).toFixed(2);
  document.getElementById('summary-duration').textContent = formatDurationLong(record.durationSec);
  const kmh = record.durationSec > 0 ? (record.distanceM / 1000) / (record.durationSec / 3600) : 0;
  document.getElementById('summary-pace').textContent = kmh.toFixed(1);
  document.getElementById('summary-poop').textContent = record.events.filter((e) => e.type === 'poop').length;
  document.getElementById('summary-treat').textContent = record.events.filter((e) => e.type === 'treat').length;

  const list = document.getElementById('summary-events');
  list.innerHTML = '';
  if (record.events.length === 0) {
    list.innerHTML = '<li style="justify-content:center;color:var(--muted);">기록된 활동이 없어요</li>';
  } else {
    const photos = record.events.filter((e) => e.type === 'photo');
    record.events.forEach((e) => {
      const li = document.createElement('li');
      const time = new Date(e.t).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
      if (e.type === 'photo') {
        li.innerHTML = `<span class="event-photo"><img src="${e.photo}" alt="산책 사진" />사진</span><span class="time">${time}</span>`;
        li.querySelector('.event-photo').addEventListener('click', () => openLightbox(photos, photos.indexOf(e)));
      } else {
        li.innerHTML = `<span>${eventIcons[e.type]} ${e.sub}</span><span class="time">${time}</span>`;
      }
      list.appendChild(li);
    });
  }

  showView('summary');
  setTimeout(() => renderSummaryMap(record), 60);
}

function renderSummaryMap(record) {
  if (summaryMapInstance) { summaryMapInstance.remove(); summaryMapInstance = null; }
  summaryMapInstance = L.map('summary-map', { zoomControl: false, dragging: true, scrollWheelZoom: false });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19,
  }).addTo(summaryMapInstance);

  if (record.path.length > 0) {
    const latlngs = record.path.map((p) => [p.lat, p.lng]);
    const line = L.polyline(latlngs, { color: '#ffb81f', weight: 5 }).addTo(summaryMapInstance);
    L.circleMarker(latlngs[0], { radius: 6, color: '#4caf50', fillColor: '#4caf50', fillOpacity: 1 }).addTo(summaryMapInstance);
    L.circleMarker(latlngs[latlngs.length - 1], { radius: 6, color: '#d9573f', fillColor: '#d9573f', fillOpacity: 1 }).addTo(summaryMapInstance);
    record.events.forEach((e) => {
      if (e.lat == null) return;
      const icon = L.divIcon({ html: `<div style="font-size:18px;transform:translate(-50%,-100%);">${eventIcons[e.type]}</div>`, className: '' });
      L.marker([e.lat, e.lng], { icon }).addTo(summaryMapInstance);
    });
    summaryMapInstance.fitBounds(line.getBounds(), { padding: [20, 20] });
  } else {
    summaryMapInstance.setView([37.5665, 126.9780], 14);
  }
  setTimeout(() => summaryMapInstance.invalidateSize(), 50);
}

// ===== 사진 라이트박스 =====
const lightboxEl = document.getElementById('photo-lightbox');
const lightboxTrack = document.getElementById('lightbox-track');
const lightboxCounter = document.getElementById('lightbox-counter');

function openLightbox(photos, startIndex) {
  if (!photos.length) return;
  lightboxTrack.innerHTML = photos
    .map((p) => `<div class="lightbox-slide"><img src="${p.photo}" alt="산책 사진" /></div>`)
    .join('');
  lightboxEl.classList.remove('hidden');
  lightboxTrack.onscroll = () => updateLightboxCounter(photos.length);
  requestAnimationFrame(() => {
    lightboxTrack.scrollLeft = startIndex * lightboxTrack.clientWidth;
    updateLightboxCounter(photos.length);
  });
}

function updateLightboxCounter(total) {
  const idx = Math.round(lightboxTrack.scrollLeft / lightboxTrack.clientWidth);
  lightboxCounter.textContent = total > 1 ? `${idx + 1} / ${total}` : '';
}

function renderHistoryList() {

    emptyText.innerHTML = currentHistoryPeriod === 'all'
      ? '아직 산책 기록이 없어요.<br/>첫 산책을 시작해보세요!'
      : '이 기간에는 산책 기록이 없어요.';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

    li.innerHTML = `
      <button class="h-delete" aria-label="기록 삭제">✕</button>
      <div class="h-date">${formatDateKorean(w.startTime)}</div>
      <div class="h-meta">
        <span>${(w.distanceM / 1000).toFixed(2)}km</span>
        <span>${formatDurationLong(w.durationSec)}</span>
        <span>💩 ${poop}</span>
        <span>🦴 ${treat}</span>
        ${photoCount > 0 ? `<span class="meta-photo"><svg class="icon-inline"><use href="#icon-camera"/></svg>${photoCount}</span>` : ''}
      </div>`;
    li.addEventListener('click', () => showWalkSummary(w, false));
    li.querySelector('.h-delete').addEventListener('click', (e) => {
      e.stopPropagation();

function deleteWalk(id) {
  const ok = confirm('이 산책 기록을 삭제할까요? 되돌릴 수 없어요.');
  if (!ok) return;
  removeWalk(id);
}

// ===== 통계 화면 =====
let currentStatsPeriod = 'week';

function startOfDay(d) {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  return x;
}
function startOfWeek(d) {
  const x = startOfDay(d);
  const day = x.getDay(); // 0=일요일
  x.setDate(x.getDate() - day);
  return x;
}
function startOfMonth(d) {
  const x = startOfDay(d);
  x.setDate(1);
  return x;
}

function walksInPeriod(period) {
  const walks = loadWalks();
  if (period === 'all') return walks;
  const now = new Date();
  const from = period === 'week' ? startOfWeek(now) : startOfMonth(now);
  return walks.filter((w) => w.startTime >= from.getTime());
}

document.querySelectorAll('#stats-tabs .stats-tab').forEach((btn) => {
  btn.addEventListener('click', () => {
    currentStatsPeriod = btn.dataset.period;
    document.querySelectorAll('#stats-tabs .stats-tab').forEach((b) => b.classList.toggle('active', b === btn));
    renderStats(currentStatsPeriod);
  });
});

document.getElementById('btn-goto-stats').addEventListener('click', () => {
  renderStats(currentStatsPeriod);
  showView('stats');
});

document.getElementById('btn-close-stats').addEventListener('click', () => {
  renderHistoryList();
  showView('history');
});

function renderStats(period) {
  const walks = walksInPeriod(period);
  const totalDist = walks.reduce((sum, w) => sum + w.distanceM, 0) / 1000;
  const totalDurationSec = walks.reduce((sum, w) => sum + w.durationSec, 0);
  const poop = walks.reduce((sum, w) => sum + w.events.filter((e) => e.type === 'poop').length, 0);
  const treat = walks.reduce((sum, w) => sum + w.events.filter((e) => e.type === 'treat').length, 0);

  document.getElementById('stats-count').textContent = walks.length;
  document.getElementById('stats-dist').textContent = totalDist.toFixed(1);
  document.getElementById('stats-time').textContent = formatDurationLong(totalDurationSec);
  document.getElementById('stats-poop').textContent = poop;
  document.getElementById('stats-treat').textContent = treat;

  renderWeekChart();
}

function renderWeekChart() {
  const walks = loadWalks();
  const days = [];
  const today = startOfDay(new Date());
  for (let i = 6; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    days.push(d);
  }
  const dayLabels = ['일', '월', '화', '수', '목', '금', '토'];
  const totals = days.map((d) => {
    const next = new Date(d);
    next.setDate(next.getDate() + 1);
    const distM = walks
      .filter((w) => w.startTime >= d.getTime() && w.startTime < next.getTime())
      .reduce((sum, w) => sum + w.distanceM, 0);
    return distM / 1000;
  });

  const wrap = document.getElementById('week-chart');
  const max = Math.max(...totals, 0.1);
  const todayTime = today.getTime();

  wrap.innerHTML = `<div class="chart-bars">${
    days.map((d, i) => {
      const h = Math.max((totals[i] / max) * 100, totals[i] > 0 ? 6 : 0);
      const isToday = d.getTime() === todayTime;
      return `<div class="chart-col${isToday ? ' today' : ''}">
        <span class="bar-value">${totals[i] > 0 ? totals[i].toFixed(1) : ''}</span>
        <div class="bar" style="height:${h}%"></div>
        <span class="bar-label">${dayLabels[d.getDay()]}</span>
      </div>`;
    }).join('')
  }</div>`;
}

// ===== 내보내기 / 가져오기 =====
document.getElementById('btn-export').addEventListener('click', async () => {
  const data = {
    type: 'walkdiary-backup',
    exportedAt: new Date().toISOString(),
    photo: profileCache.photo || null,
    walks: loadWalks(),
  };
  const jsonStr = JSON.stringify(data, null, 2);
  const stamp = new Date().toISOString().slice(0, 10).replace(/-/g, '');
  const filename = `mongi_walks_${stamp}.json`;

  // iOS Safari는 <a download>로 파일이 실제 저장되지 않는 경우가 많아
  // 공유 시트(파일 앱에 저장)를 우선 사용하고, 지원 안 되면 기존 방식으로 대체
  if (navigator.canShare) {
    try {
      const file = new File([jsonStr], filename, { type: 'application/json' });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return;
      }
    } catch (err) {
      if (err && err.name === 'AbortError') return; // 사용자가 취소함
    }
  }

  const blob = new Blob([jsonStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

document.getElementById('btn-import').addEventListener('click', () => {
  document.getElementById('import-input').click();
});

document.getElementById('import-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  let data;
  try {
    data = JSON.parse(await file.text());
  } catch {
    alert('올바른 백업 파일이 아니에요.');
    return;
  }
  if (!data || !Array.isArray(data.walks)) {
    alert('올바른 백업 파일이 아니에요.');
    return;
  }
  const existingIds = new Set(loadWalks().map((w) => w.id));
  const toAdd = data.walks.filter((w) => w && w.id && !existingIds.has(w.id));
  await Promise.all(toAdd.map((w) => saveWalk(w)));

  if (data.photo && !profileCache.photo) {
    savePhoto(data.photo);
  }

  alert(`${toAdd.length}개의 기록을 가져왔어요.`);
});
